# Ordin — four containers.
#
# Slice 1a defines postgres only; slice 1b adds api, worker and web.
# The dev loop on an 8 GB box runs postgres here and api/worker/web natively.
# The full four-container path is the demo path, verified before slice 3.
#
# Every service carries an explicit mem_limit. On a 7.8 GB host the Linux OOM
# killer selects by size, and an unbounded worker takes postgres with it — where
# the audit chain, the job queue and the case record all live (threat OPS-03).

# Pinned so the project name does not track the folder name. Without this, compose
# derives it from the directory, so renaming the checkout orphans the containers,
# the network and - most painfully - the data volume.
#
# Everything below is namespaced `ordin-build`, including container_name and the
# volume. A second checkout of this project exists at D:\Legal Assistant with an
# identical compose file; because container names are GLOBALLY unique in Docker,
# both were attaching to one container and one volume - so whichever tree migrated
# last silently replaced the other's schema. Namespacing is what keeps the two
# independent. Do not un-namespace these without checking that the other checkout
# is gone.
name: ordin-build

services:
  postgres:
    image: postgres:16-alpine
    container_name: ordin-build-postgres
    restart: unless-stopped
    environment:
      # ordin_owner owns the schema and is what Alembic connects as.
      # It is NOT the role the application uses — see docs/adr/0001.
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-ordin_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-ordin}
      # Consumed by db/init/01-roles.sh to create the restricted runtime role.
      ORDIN_APP_PASSWORD: ${ORDIN_APP_PASSWORD:?ORDIN_APP_PASSWORD must be set}
    ports:
      # Bound to loopback deliberately. Publishing 0.0.0.0 exposes the database
      # to the venue LAN; there is no authentication slice and no rate limiting
      # (threats EXT-01, EXT-04). This is the cheapest control in the project.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - ordin_build_pgdata:/var/lib/postgresql/data
      # Runs once, on first initialisation of an empty volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-ordin_owner} -d ${POSTGRES_DB:-ordin}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      # No OCR in the api image: OCR belongs to the worker, and an api that could
      # run it would invite someone to call it synchronously on a request.
      target: base
    container_name: ordin-build-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: &python_env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ordin}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:-ordin_owner}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?required}
      ORDIN_APP_USER: ${ORDIN_APP_USER:-ordin_app}
      ORDIN_APP_PASSWORD: ${ORDIN_APP_PASSWORD:?required}
      ORDIN_ENV: ${ORDIN_ENV:-dev}
      ORDIN_LOG_LEVEL: ${ORDIN_LOG_LEVEL:-INFO}
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:${ORDIN_API_PORT:-8001}:8000"
    mem_limit: 256m
    healthcheck:
      # Uses the api's own contract: 503 when a dependency is down, so this goes
      # unhealthy for the same reasons the health page goes red.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: worker
    container_name: ordin-build-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *python_env
    command: ["python", "-m", "worker.main"]
    mem_limit: 256m

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: ordin-build-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # The only portable telemetry control - see docker/web.Dockerfile.
      NEXT_TELEMETRY_DISABLED: "1"
      # Server-side fetch inside the compose network; the browser never uses this.
      ORDIN_API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:${ORDIN_WEB_PORT:-3001}:3000"
    mem_limit: 384m

volumes:
  ordin_build_pgdata:
    name: ordin_build_pgdata
