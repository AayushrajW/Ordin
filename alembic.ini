[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Deliberately empty. The URL is built in alembic/env.py from Settings, which
# reads .env - so a working credential never sits in a committed file, and
# migrations always run as ordin_owner rather than as the application role
# (docs/adr/0001).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
