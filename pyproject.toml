[project]
name = "ordin"
version = "0.1.0"
description = "Case-centric evidence intelligence for Indian legal and investigation agencies"
requires-python = ">=3.11,<3.12"

# Pinned to 3.11 to match the api container exactly. This box also has 3.10 and
# 3.13; running a different interpreter natively than the one that ships is the
# dev/demo divergence the two-path acceptance test exists to catch.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "requires_db: needs a running postgres (skipped when unreachable)",
]

[tool.setuptools]
# Not a distributable package; the layout is an application, not a library.
py-modules = []
