[project]
name = "ordin"
version = "0.1.0"
description = "Case-centric evidence intelligence for Indian legal and investigation agencies"
requires-python = ">=3.11,<3.12"

# Pinned to 3.11 to match the api container exactly. This box also has 3.10 and
# 3.13; running a different interpreter natively than the one that ships is the
# dev/demo divergence the two-path acceptance test exists to catch.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # PyMuPDF. Already the decided library for destructive redaction (slice 7);
    # slice 6a uses it to GENERATE the fixture documents so the same renderer
    # produces and later redacts them. AGPL-3.0 - see docs/adr/0009.
    "pymupdf>=1.24,<1.27",
    # Policy files. CLAUDE.md decides "versioned YAML policy files"; this reads them.
    "PyYAML>=6.0,<7.0",
    # httpx. Runtime, not dev-only, because the Sentinel dashboard (slice 8) runs the
    # scenarios against the live app through an ASGI transport, and the demo path is
    # `docker compose up` - so the api image needs it or /sentinel is dead in the one
    # place a judge will look.
    #   purpose     : in-process ASGI client for the scenario runner
    #   licence     : BSD-3-Clause
    #   RAM         : negligible; it was already installed for the test suite
    #   alternative : starlette's TestClient, which is httpx underneath anyway
    #   production  : the dashboard would not ship; ADR 0015 restricts it to dev
    "httpx>=0.27,<0.28",
    # argon2-cffi. Password hashing for real accounts (docs/PLAN-PRODUCT.md P2).
    # CLAUDE.md: "never implements custom cryptography - use established libraries
    # only". This is that library.
    #   purpose     : verify and hash account passwords (Argon2id)
    #   licence     : MIT
    #   RAM         : ~1 MB resident; each hash costs 64 MiB by default, so the
    #                 parameters are tuned down in infra/passwords.py for an 8 GB
    #                 laptop and the reasoning is recorded there
    #   alternative : bcrypt, which is fine and older; passlib, which is unmaintained
    #   production  : unchanged - Argon2id is the current recommendation
    "argon2-cffi>=23.1,<24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "requires_db: needs a running postgres (skipped when unreachable)",
]

[tool.setuptools]
# Not a distributable package; the layout is an application, not a library.
py-modules = []
